site_name: EduTech Exam Preparation Portal
site_description: Exam preparation, study material, mock tests, current affairs, and interview guidance.
site_url: https://dwivedisaurabh4.github.io/eduTech/
repo_name: dwivedisaurabh4/eduTech
repo_url: https://github.com/dwivedisaurabh4/eduTech
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: indigo
      accent: amber
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
      primary: blue
      accent: amber
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.tilde

docs_dir: docs
site_dir: site

plugins:
  - search
  - awesome-pages
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Teacher Exams:
    - TGT:
      - Introduction: up-tgt/introduction.md
      - Eligibility: up-tgt/eligibility.md
      - Exam Pattern: up-tgt/exam-pattern.md
      - Preparation Strategy: up-tgt/preparation-strategy.md
    - PGT:
      - Introduction: up-pgt/introduction.md
      - Eligibility: up-pgt/eligibility.md
      - Exam Pattern: up-pgt/exam-pattern.md
      - Preparation Strategy: up-pgt/preparation-strategy.md
    - Primary Teacher: teacher-exams/primary-teacher.md
    - Junior Teacher: teacher-exams/junior-teacher.md
    - Principal: teacher-exams/principal.md
  - Police Exams:
    - Home Guard: police-exams/home-guard.md
    - Sub-Inspector (SI): police-exams/sub-inspector.md
  - SSC Exams:
    - SSC CGL: ssc-exams/cgl.md
    - SSC CHSL: ssc-exams/chsl.md
    - SSC MTS: ssc-exams/mts.md
    - Other SSC Exams: ssc-exams/other.md
  - Railway Exams:
    - RRB NTPC: railway-exams/ntpc.md
    - RRB Group D: railway-exams/group-d.md
    - RRB ALP: railway-exams/alp.md
    - Other Railway Exams: railway-exams/other.md
  - Interview Preparation:
    - IT Interview: interview-preparation/it-interview.md
    - BPO Interview: interview-preparation/bpo-interview.md
    - HR Interview: interview-preparation/hr-interview.md
    - Technical Interview: interview-preparation/technical-interview.md
  - Current Affairs: current-affairs/index.md
  - Mock Tests: online-tests/mock-tests.md
  - Study Material:
      - Syllabus:
        - Overview: syllabus/index.md
        - UP-TGT Syllabus: syllabus/up-tgt-syllabus.md
        - UP-PGT Syllabus: syllabus/up-pgt-syllabus.md
        - Chemistry: syllabus/chemistry.md
        - Physics: syllabus/physics.md
        - Biology: syllabus/biology.md
        - Hindi: syllabus/hindi.md
        - English: syllabus/english.md
        - General Studies: syllabus/general-studies.md
      - Notes:
        - Overview: notes/index.md
        - Chemistry: notes/chemistry/chapter-01.md
        - Physics: notes/physics/chapter-01.md
        - Biology: notes/biology/chapter-01.md
        - Hindi: notes/hindi/chapter-01.md
        - English: notes/english/chapter-01.md
        - General Studies: notes/gs/chapter-01.md
      - MCQs:
        - Overview: mcq/index.md
        - Chemistry: mcq/chemistry-mcq.md
        - Physics: mcq/physics-mcq.md
        - Biology: mcq/biology-mcq.md
        - Hindi: mcq/hindi-mcq.md
        - English: mcq/english-mcq.md
        - General Studies: mcq/gs-mcq.md
      - Online Tests:
        - Test Hub: online-tests/index.md
        - Chemistry: online-tests/chemistry-test-links.md
        - Physics: online-tests/physics-test-links.md
        - Biology: online-tests/biology-test-links.md
      - Previous Papers: resources/previous-papers.md
      - Books: resources/books.md
      - YouTube Channels: resources/youtube-channels.md
      - Websites: resources/websites.md
      - Job Updates:
        - Latest Vacancy: job-updates/latest-vacancy.md
        - Admit Card: job-updates/admit-card.md
        - Answer Key: job-updates/answer-key.md
        - Results: job-updates/result.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dwivedisaurabh4/eduTech
